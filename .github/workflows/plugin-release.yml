name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    # 官方复用工作流：按 DBX_PLUGIN_TARGET 构建每个平台的未签名候选，
    # 校验字节后把 release-candidates.json 与 .dbxp 一起挂到 GitHub Release。
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.10
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.10
      go-version: "1.22.x"
      rust-toolchain: ""
      # 官方 CLI 只为当前 runner 平台构建 sidecar，因此每个平台各用一个 runner。
      build-matrix: '{"include":[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"windows-2022","target":"windows-x64"},{"runner":"macos-15-intel","target":"darwin-x64"},{"runner":"macos-15","target":"darwin-arm64"}]}'
